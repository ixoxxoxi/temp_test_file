<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu Without Tailwind</title>
    <!-- 只保留必要的外部资源 -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/babel-standalone@6.26.0/babel.min.js"></script>

    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f9fafb;
            color: #111827;
            line-height: 1.5;
        }

        ul, li {
            list-style: none;
        }

        /* 主内容区域样式 */
        .main-content {
            min-height: 100vh;
            padding: 32px;
            margin-left: 256px; /* 为侧边栏留出空间 */
        }

        .main-content h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #1f2937;
        }

        .main-content p {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 32px;
        }

        .spacer {
            height: 200vh; /* 用于测试滚动 */
        }

        /* 侧边栏容器样式 */
        .sidebar {
            position: fixed;
            top: 20vh;
            height: 60vh;
            width: 256px;
            background-color: white;
            border-right: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 滚动容器样式 - 应用scrollbar-gutter解决宽度问题 */
        .sidebar-inner {
            height: 100%;
            overflow-y: auto;
            padding: 8px;
            /* 核心属性：为滚动条预留稳定空间，不影响内容宽度 */
            scrollbar-gutter: stable;
        }

        /* 自定义滚动条样式 */
        .sidebar-inner::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-inner::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-inner::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0);
            border-radius: 3px;
            transition: background-color 0.2s ease;
        }

        .sidebar-inner:hover::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
        }

        /* 菜单项样式 */
        .menu-item {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-item > div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 6px;
            color: #1f2937;
            width: 100%;
        }

        .menu-item:hover > div {
            background-color: #f1f5f9;
        }

        .menu-item i {
            color: #6b7280;
            transition: transform 0.3s ease;
        }

        /* 子菜单样式及过渡动画 */
        .submenu {
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }

        .submenu-closed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .submenu-open {
            max-height: 24rem;
            opacity: 1;
            margin-top: 4px;
        }

        .submenu-list {
            margin-left: 16px;
            padding-left: 8px;
            border-left: 2px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 确保React正确加载
        if (typeof React !== 'undefined') {
            const { useState } = React;

            // 侧边栏菜单组件
            const SidebarMenu = ({ items }) => {
                // 管理展开的菜单状态
                const [expanded, setExpanded] = useState([]);

                // 切换菜单展开/折叠
                const toggle = (key) => {
                    setExpanded(prev => 
                        prev.includes(key)
                            ? prev.filter(k => k !== key)
                            : [...prev, key]
                    );
                };

                // 递归渲染菜单项
                const renderItem = (item) => {
                    const hasChildren = item.children && item.children.length > 0;
                    const isOpen = expanded.includes(item.key);

                    return (
                        <li key={item.key} className="menu-item">
                            <div onClick={() => hasChildren && toggle(item.key)}>
                                <span>{item.label}</span>
                                {hasChildren && (
                                    <i className={`fa ${isOpen ? 'fa-chevron-down' : 'fa-chevron-right'}`}></i>
                                )}
                            </div>

                            {/* 子菜单及过渡动画 */}
                            {hasChildren && (
                                <div className={`submenu ${isOpen ? 'submenu-open' : 'submenu-closed'}`}>
                                    <ul className="submenu-list">
                                        {item.children.map(child => renderItem(child))}
                                    </ul>
                                </div>
                            )}
                        </li>
                    );
                };

                return (
                    <div className="sidebar">
                        <ul className="sidebar-inner">
                            {items.map(item => renderItem(item))}
                        </ul>
                    </div>
                );
            };

            // 主应用组件
            const App = () => {
                // 菜单数据
                const menuItems = [
                    {
                        key: '1',
                        label: 'Navigation One',
                        children: [
                            { key: '11', label: 'Option 1' },
                            { key: '12', label: 'Option 2' },
                            { key: '13', label: 'Option 3' },
                            { key: '14', label: 'Option 4' },
                            { key: '15', label: 'Option 5' },
                            { key: '16', label: 'Option 6' },
                        ],
                    },
                    {
                        key: '2',
                        label: 'Navigation Two',
                        children: [
                            { key: '21', label: 'Option 1' },
                            { key: '22', label: 'Option 2' },
                            {
                                key: '23',
                                label: 'Submenu',
                                children: [
                                    { key: '231', label: 'Option 1', value: { a: 1 } },
                                    { key: '232', label: 'Option 2', value: { a: 2 } },
                                    { key: '233', label: 'Option 3', value: { a: 3 } },
                                ],
                            },
                            {
                                key: '24',
                                label: 'Submenu 2',
                                children: [
                                    { key: '241', label: 'Option 1' },
                                    { key: '242', label: 'Option 2' },
                                    { key: '243', label: 'Option 3' },
                                ],
                            },
                        ],
                    },
                    {
                        key: '3',
                        label: 'Navigation Three',
                        children: [
                            { key: '31', label: 'Option 1' },
                            { key: '32', label: 'Option 2' },
                            { key: '33', label: 'Option 3' },
                            { key: '34', label: 'Option 4' },
                        ],
                    },
                ];

                return (
                    <div>
                        <div className="main-content">
                            <h1>Main Content Area</h1>
                            <p>展开菜单时，滚动条不会挤压内容宽度</p>
                            <div className="spacer"></div>
                        </div>
                        <SidebarMenu items={menuItems} />
                    </div>
                );
            };

            // 渲染应用
            ReactDOM.render(<App />, document.getElementById('root'));
        }
    </script>
</body>
</html>
