<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu with Pure CSS</title>
    <!-- 仅保留必要的React和Font Awesome资源 -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/babel-standalone@6.26.0/babel.min.js"></script>

    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            padding-left: 260px; /* 为侧边栏预留空间 */
            line-height: 1.6;
        }

        /* 主内容区域 */
        .main-container {
            padding: 2rem;
        }

        .main-title {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #2d3748;
        }

        .main-description {
            font-size: 1rem;
            color: #4a5568;
            margin-bottom: 2rem;
        }

        .scroll-spacer {
            height: 200vh; /* 用于测试页面滚动 */
        }

        /* 侧边栏样式 */
        .sidebar {
            position: fixed;
            top: 20vh;
            left: 0;
            width: 250px;
            height: 60vh;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
        }

        /* 滚动容器 - 解决滚动条宽度问题的核心 */
        .sidebar-scroll {
            height: 100%;
            overflow-y: auto;
            padding: 10px;
            scrollbar-gutter: stable; /* 为滚动条预留固定空间 */
        }

        /* 自定义滚动条样式 */
        .sidebar-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-scroll::-webkit-scrollbar-thumb {
            background-color: transparent;
            border-radius: 3px;
            transition: background-color 0.2s ease;
        }

        .sidebar-scroll:hover::-webkit-scrollbar-thumb {
            background-color: rgba(100, 116, 139, 0.5);
        }

        /* 菜单列表基础样式 */
        .menu-list {
            list-style: none;
        }

        .menu-item {
            margin-bottom: 4px;
        }

        /* 菜单项标题样式 */
        .menu-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            width: 100%;
            background-color: transparent;
            border: none;
            border-radius: 4px;
            color: #2d3748;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .menu-title:hover {
            background-color: #f1f5f9;
        }

        /* 箭头图标样式 */
        .menu-arrow {
            color: #64748b;
            transition: transform 0.3s ease;
            font-size: 12px;
        }

        /* 子菜单样式 */
        .submenu-container {
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }

        .submenu-closed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .submenu-open {
            max-height: 600px; /* 足够容纳子菜单 */
            opacity: 1;
            margin-top: 4px;
        }

        .submenu-list {
            list-style: none;
            margin-left: 15px;
            padding-left: 10px;
            border-left: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div id="app-root"></div>

    <script type="text/babel">
        // 检查React是否加载
        if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
            const { useState } = React;

            // 侧边栏菜单组件
            const SidebarMenu = ({ menuItems }) => {
                // 管理展开的菜单状态
                const [expandedKeys, setExpandedKeys] = useState([]);

                // 切换菜单展开/折叠状态
                const toggleMenu = (key) => {
                    setExpandedKeys(prevKeys => 
                        prevKeys.includes(key)
                            ? prevKeys.filter(k => k !== key)
                            : [...prevKeys, key]
                    );
                };

                // 递归渲染菜单项
                const renderMenuItem = (item) => {
                    const hasChildren = item.children && item.children.length > 0;
                    const isExpanded = expandedKeys.includes(item.key);

                    return (
                        <li key={item.key} className="menu-item">
                            <button 
                                className="menu-title"
                                onClick={() => hasChildren && toggleMenu(item.key)}
                            >
                                <span>{item.label}</span>
                                {hasChildren && (
                                    <i className={`fa ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} menu-arrow`}></i>
                                )}
                            </button>

                            {/* 子菜单容器 */}
                            {hasChildren && (
                                <div className={`submenu-container ${isExpanded ? 'submenu-open' : 'submenu-closed'}`}>
                                    <ul className="submenu-list">
                                        {item.children.map(child => renderMenuItem(child))}
                                    </ul>
                                </div>
                            )}
                        </li>
                    );
                };

                return (
                    <div className="sidebar">
                        <ul className="menu-list sidebar-scroll">
                            {menuItems.map(item => renderMenuItem(item))}
                        </ul>
                    </div>
                );
            };

            // 主应用组件
            const App = () => {
                // 菜单数据
                const navigationItems = [
                    {
                        key: 'nav1',
                        label: 'Navigation One',
                        children: [
                            { key: 'nav1-1', label: 'Option 1' },
                            { key: 'nav1-2', label: 'Option 2' },
                            { key: 'nav1-3', label: 'Option 3' },
                            { key: 'nav1-4', label: 'Option 4' },
                            { key: 'nav1-5', label: 'Option 5' },
                            { key: 'nav1-6', label: 'Option 6' },
                        ]
                    },
                    {
                        key: 'nav2',
                        label: 'Navigation Two',
                        children: [
                            { key: 'nav2-1', label: 'Option 1' },
                            { key: 'nav2-2', label: 'Option 2' },
                            {
                                key: 'nav2-3',
                                label: 'Submenu',
                                children: [
                                    { key: 'nav2-3-1', label: 'Sub Option 1' },
                                    { key: 'nav2-3-2', label: 'Sub Option 2' },
                                    { key: 'nav2-3-3', label: 'Sub Option 3' },
                                ]
                            },
                            {
                                key: 'nav2-4',
                                label: 'Another Submenu',
                                children: [
                                    { key: 'nav2-4-1', label: 'Sub Option A' },
                                    { key: 'nav2-4-2', label: 'Sub Option B' },
                                ]
                            }
                        ]
                    },
                    {
                        key: 'nav3',
                        label: 'Navigation Three',
                        children: [
                            { key: 'nav3-1', label: 'Option X' },
                            { key: 'nav3-2', label: 'Option Y' },
                            { key: 'nav3-3', label: 'Option Z' },
                        ]
                    },
                    {
                        key: 'nav4',
                        label: 'Navigation Four',
                        children: []
                    }
                ];

                return (
                    <div>
                        <SidebarMenu menuItems={navigationItems} />
                        <div className="main-container">
                            <h1 className="main-title">Main Content Area</h1>
                            <p className="main-description">
                                展开菜单时，滚动条不会挤压内容宽度，因为已使用scrollbar-gutter: stable属性
                            </p>
                            <div className="scroll-spacer"></div>
                        </div>
                    </div>
                );
            };

            // 渲染应用
            ReactDOM.render(<App />, document.getElementById('app-root'));
        } else {
            document.getElementById('app-root').innerHTML = '<p>Error: React library not loaded properly</p>';
        }
    </script>
</body>
</html>
